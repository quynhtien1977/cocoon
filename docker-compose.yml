name: cocoon-crm

services:
  db:
    image: postgres:18
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db:/workspace/db:ro
      # COC-54: db/backup.sh ghi file .dump ra đây, nên mount này phải ghi được.
      - ./backups:/workspace/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/Cocoon.Api/Dockerfile
      target: dev
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      Jwt__Issuer: ${Jwt__Issuer:-cocoon-api}
      Jwt__Audience: ${Jwt__Audience:-cocoon-web}
      Web__Origin: ${WEB_ORIGIN:-http://localhost:3000}
      Storage__Endpoint: minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      Storage__Bucket: ${MINIO_BUCKET:-cocoon-feedback}
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-5080}:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["sh", "scripts/start-api.sh"]

  # Feedback photos. Official minio/minio images are no longer pullable; this is Chainguard's MinIO build,
  # pinned by digest. It has no shell or curl, so there is no healthcheck; the API creates the bucket on first upload.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    pull_policy: missing
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  nuget-cache:
  minio-data:
