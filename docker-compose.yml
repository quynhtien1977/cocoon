name: cocoon-crm

services:
  db:
    image: postgres:18
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db:/workspace/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/Cocoon.Api/Dockerfile
      target: dev
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      Jwt__Issuer: ${Jwt__Issuer:-cocoon-api}
      Jwt__Audience: ${Jwt__Audience:-cocoon-web}
      Web__Origin: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${API_HTTP_PORT:-5080}:8080"
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "scripts/start-api.sh"]

volumes:
  postgres-data:
  nuget-cache:
